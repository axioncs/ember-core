name: ci

on:
  push:
    branches: [ember]
  pull_request:
  workflow_dispatch:

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Parser tests
        run: nix shell nixpkgs#gcc nixpkgs#gnumake -c make test-stplugin

      # The full library needs the Steam SDK headers and vendored static
      # libraries and is built through the ember flake, not here.
