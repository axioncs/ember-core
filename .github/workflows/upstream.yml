name: upstream

# AceSLS moves `dev-multiarch` when Valve ships a new client — that is exactly
# when the byte signatures in src/patterns.cpp have to be re-derived. This does
# not merge blindly: it opens a pull request when the merge is clean and an issue
# when it is not, because most of src/feats/apps.cpp and src/hooks.cpp is ours.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ember
          fetch-depth: 0

      - name: Probe upstream
        id: probe
        run: |
          git remote add upstream https://github.com/AceSLS/SLSsteam.git
          git fetch --no-tags upstream dev-multiarch
          behind=$(git rev-list --count HEAD..upstream/dev-multiarch)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream/dev-multiarch > upstream.txt
          echo "commits: $behind"

      - name: Attempt the merge on a branch
        id: merge
        if: steps.probe.outputs.behind != '0'
        run: |
          git config user.name  "ember upstream bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b upstream-sync
          if git merge --no-edit upstream/dev-multiarch; then
            echo "clean=1" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "clean=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull request when the merge is clean
        if: steps.merge.outputs.clean == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-sync
          base: ember
          title: "sync with AceSLS dev-multiarch"
          body-path: upstream.txt
          labels: upstream

      - name: Issue when it conflicts
        if: steps.merge.outputs.clean == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "`AceSLS/SLSsteam@dev-multiarch` has new commits that do not merge cleanly into `ember`.",
              "",
              "This usually means a new Steam client, so the signatures in `src/patterns.cpp`",
              "probably need re-deriving as well. Rebase manually; do not force the merge.",
              "",
              "```",
              require('fs').readFileSync('upstream.txt', 'utf8').slice(0, 3000),
              "```",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "upstream moved and the merge conflicts",
              body,
              labels: ["upstream"],
            });
